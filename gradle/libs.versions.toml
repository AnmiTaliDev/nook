lifecycleViewmodelNavigation3 = "2.12.0-alpha02"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
javaxInject = "1"
junit = "4.13.2"
